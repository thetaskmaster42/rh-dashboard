name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    # The whole quality gate. No pytest and no lint config — `uv run
    # ./rh-dashboard selftest` is it, so this job is the build.
    name: selftest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"

      - name: Confirm the dashboard imports nothing undeclared
        # This replaced a check that asserted requirements.txt and
        # pyproject.toml did not exist. That was only ever a proxy for the real
        # rule — rh_dashboard/ pulls in nothing beyond the standard library and
        # a declared, deliberate few — and it could not survive the project
        # taking a dependency on purpose. The ast scan enforces the rule
        # directly, and catches a stray `import requests` that a filename check
        # never would, including one hidden inside a function body.
        run: python3 .github/scripts/check_imports.py rh_dashboard

      - name: Install the locked dependencies
        # --frozen: obey uv.lock exactly. A resolution that would need to
        # change it fails here rather than silently upgrading DuckDB.
        run: uv sync --frozen --python ${{ matrix.python }}

      - name: Run the suite
        run: uv run --frozen ./rh-dashboard selftest

      - name: Build the sample dashboard
        run: uv run --frozen ./rh-dashboard build -i sample_data -o /tmp/preview

      - name: The generated page must open offline
        # Group 8 asserts this too; repeated here because it is the project's
        # central promise and worth failing loudly and early on.
        run: |
          page=/tmp/preview/dashboard.html
          grep -q '<script src=' "$page"   && { echo "external script"; exit 1; }
          grep -q 'rel="stylesheet"' "$page" && { echo "external stylesheet"; exit 1; }
          grep -Eq 'https?://' "$page"     && { echo "external reference"; exit 1; }
          echo "self-contained: $(wc -c < "$page") bytes"

  cli-output-unchanged:
    # The upload chrome is opt-in, so `build` output must not move when
    # server-side features change. Rebuild the page at the merge base and at
    # HEAD and diff them, ignoring only the generation timestamp.
    name: CLI page is byte-stable
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Deliberately NOT run through uv. The merge base may predate the
      # DuckDB dependency entirely, so `uv sync` would fail there — and
      # `build` imports nothing outside the standard library either way, which
      # is a property worth continuing to exercise rather than papering over.
      - name: Build at HEAD
        run: ./rh-dashboard build -i sample_data -o /tmp/head

      - name: Build at the merge base
        run: |
          git worktree add /tmp/base "${{ github.event.pull_request.base.sha }}"
          (cd /tmp/base && ./rh-dashboard build -i sample_data -o /tmp/base-out)

      - name: Diff, ignoring the timestamp
        run: |
          strip() { sed 's/Generated [^&]*//' "$1"; }
          if diff <(strip /tmp/base-out/dashboard.html) <(strip /tmp/head/dashboard.html); then
            echo "CLI output unchanged"
          else
            echo
            echo "::warning::The CLI-built page changed. That is fine if intended —"
            echo "::warning::but if this PR only touched server.py, it should not have."
          fi

  helm:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Lint
        run: helm lint ./chart

      - name: Render every path that has a conditional in it
        run: |
          set -e
          helm template rh ./chart > /dev/null
          helm template rh ./chart --set ingress.enabled=true --set ingress.className=nginx > /dev/null
          helm template rh ./chart --set auth.enabled=true --set auth.username=u --set auth.password=p > /dev/null
          helm template rh ./chart --set auth.enabled=true --set auth.existingSecret=mine > /dev/null
          helm template rh ./chart --set persistence.existingClaim=my-pvc > /dev/null
          helm template rh ./chart --set persistence.enabled=false > /dev/null
          echo "all value permutations render"

      - name: Secret keys must match what the deployment reads
        run: |
          set -e
          helm template rh ./chart --set auth.enabled=true \
            --set auth.username=u --set auth.password=p > /tmp/auth-default.yaml
          helm template rh ./chart --set auth.enabled=true \
            --set auth.username=u --set auth.password=p \
            --set auth.usernameKey=RH_USER --set auth.passwordKey=RH_PASS > /tmp/auth-custom.yaml
          helm template rh ./chart --set auth.enabled=true \
            --set auth.existingSecret=rh-sops \
            --set auth.usernameKey=RH_USER --set auth.passwordKey=RH_PASS > /tmp/auth-sops.yaml
          python3 .github/scripts/check_chart_auth_keys.py \
            /tmp/auth-default.yaml /tmp/auth-custom.yaml /tmp/auth-sops.yaml

      - name: Auth without credentials must refuse to render
        # Rendering an unauthenticated deployment when the operator asked for
        # auth would be the worst possible failure mode for this chart.
        run: |
          if helm template rh ./chart --set auth.enabled=true > /dev/null 2>&1; then
            echo "auth.enabled=true rendered without credentials"; exit 1
          fi
          echo "correctly refused"

  image:
    name: image builds and passes its own suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rh-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the suite inside the image
        # sample_data ships in the image for exactly this: proof that what was
        # built is the thing that passes, not just the source tree beside it.
        run: docker run --rm rh-dashboard:ci python -m rh_dashboard.cli selftest

      - name: The container serves and accepts an upload
        run: |
          docker run -d --name rh -p 8080:8080 rh-dashboard:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/healthz > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/healthz | grep -q '"ok"'
          curl -sf -F "file=@sample_data/2026-06-statement.csv" \
            http://127.0.0.1:8080/api/upload | grep -q '"saved"'
          curl -sf http://127.0.0.1:8080/ | grep -q "Net income"
          echo "served, uploaded and rebuilt"
          docker rm -f rh > /dev/null

      - name: Basic auth works when the credentials arrive as env vars
        # This is the path a SOPS-managed Secret takes in the homelab: the
        # chart puts the credentials in RH_DASHBOARD_USER/PASSWORD and nothing
        # else configures auth. Getting it wrong fails open, so prove it in CI
        # rather than discovering it in the cluster.
        run: |
          docker run -d --name rh-auth -p 8081:8080 \
            -e RH_DASHBOARD_USER=ci -e RH_DASHBOARD_PASSWORD=s3cret \
            rh-dashboard:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8081/healthz > /dev/null && break
            sleep 1
          done

          code() { curl -s -o /dev/null -w "%{http_code}" "$@"; }

          # /healthz must stay open or the kubelet probe locks the pod out
          test "$(code http://127.0.0.1:8081/healthz)" = "200"
          # everything else must challenge
          test "$(code http://127.0.0.1:8081/)" = "401"
          test "$(code http://127.0.0.1:8081/api/files)" = "401"
          test "$(code -u ci:wrong http://127.0.0.1:8081/)" = "401"
          test "$(code -u wrong:s3cret http://127.0.0.1:8081/)" = "401"
          test "$(code -u ci:s3cret http://127.0.0.1:8081/)" = "200"
          # an upload must not slip past auth either
          test "$(code -X POST -F file=@sample_data/2026-06-statement.csv \
                  http://127.0.0.1:8081/api/upload)" = "401"
          echo "auth challenges correctly and healthz stays open"
          docker rm -f rh-auth > /dev/null

      - name: A broken auth Secret must crash-loop, not serve openly
        # The realistic SOPS accident: the Secret exists and the pod starts,
        # but a key was renamed or its value is empty. The chart sets
        # RH_DASHBOARD_AUTH_REQUIRED whenever auth.enabled, so this must exit
        # non-zero instead of coming up unauthenticated.
        run: |
          for env in "-e RH_DASHBOARD_USER=ci" \
                     "-e RH_DASHBOARD_PASSWORD=s3cret" \
                     "-e RH_DASHBOARD_USER=ci -e RH_DASHBOARD_PASSWORD=" \
                     ""; do
            if docker run --rm -e RH_DASHBOARD_AUTH_REQUIRED=true $env \
                 rh-dashboard:ci > /tmp/out 2>&1; then
              echo "started unauthenticated with: $env"; cat /tmp/out; exit 1
            fi
            grep -q "Refusing to start unauthenticated" /tmp/out
            echo "  refused, as intended: [$env]"
          done
          echo "a half-configured Secret cannot fail open"

      - name: Half-configured credentials must not fail open
        # Only one of the two env vars set is a misconfiguration. The server
        # requires both, and the danger is that it quietly serves everything.
        run: |
          docker run -d --name rh-half -p 8082:8080 \
            -e RH_DASHBOARD_USER=ci rh-dashboard:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8082/healthz > /dev/null && break
            sleep 1
          done
          status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8082/)
          docker rm -f rh-half > /dev/null
          # Documented behaviour is auth-off, so 200 is expected here. This
          # test exists to make that a decision rather than an accident: if it
          # ever starts 401ing, a half-set Secret silently locks you out.
          test "$status" = "200"
          echo "half-configured auth is off, as documented (got $status)"
