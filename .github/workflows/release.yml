name: Release

# Tag a commit `v1.2.3` and this publishes the image and the chart to GHCR
# under that version. Nothing is published from `main` — a homelab that pulls
# a moving tag has no way to roll back.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 1.2.3)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: image and chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "publishing $version"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"

      - name: Never publish something that fails its own suite
        # --frozen so the gate runs against the exact dependency set the image
        # is about to be built from, not whatever resolves today.
        run: |
          uv sync --frozen
          uv run --frozen ./rh-dashboard selftest

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 as well as amd64: a homelab cluster is as likely to be a Pi
          # or an ARM mini-PC as it is an x86 box.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.v.outputs.repo }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ steps.v.outputs.repo }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Package and push the chart
        # Chart version, app version and image tag all move together, so
        # `helm install --version X` gets the image built from the same commit.
        run: |
          version="${{ steps.v.outputs.version }}"
          helm package ./chart --version "$version" --app-version "$version"
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "rh-dashboard-${version}.tgz" \
            "oci://ghcr.io/${{ steps.v.outputs.repo }}-chart"

      - name: Summary
        run: |
          version="${{ steps.v.outputs.version }}"
          repo="${{ steps.v.outputs.repo }}"
          {
            echo "### Published \`$version\`"
            echo
            echo '```bash'
            echo "helm install rh oci://ghcr.io/${repo}-chart/rh-dashboard \\"
            echo "  --version $version \\"
            echo "  --set image.repository=ghcr.io/${repo}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
