{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rh-dashboard.fullname" . }}
  labels:
    {{- include "rh-dashboard.labels" . | nindent 4 }}
  annotations:
    # Statements are the data this whole thing exists for; don't let a
    # `helm uninstall` take them with it.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
