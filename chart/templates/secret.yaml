{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- if not (and .Values.auth.username .Values.auth.password) }}
{{- fail "auth.enabled is true but no credentials were given. Either set auth.username and auth.password, or set auth.existingSecret to a Secret you manage yourself (a SOPS-encrypted one, for example) with auth.usernameKey/auth.passwordKey naming its keys." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-auth" (include "rh-dashboard.fullname" .) }}
  labels:
    {{- include "rh-dashboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.usernameKey | default "username" }}: {{ .Values.auth.username | quote }}
  {{ .Values.auth.passwordKey | default "password" }}: {{ .Values.auth.password | quote }}
{{- end }}
