{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- if not (and .Values.auth.username .Values.auth.password) }}
{{- fail "auth.enabled is true, so auth.username and auth.password must both be set (or point auth.existingSecret at a Secret with those keys)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-auth" (include "rh-dashboard.fullname" .) }}
  labels:
    {{- include "rh-dashboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.auth.username | quote }}
  password: {{ .Values.auth.password | quote }}
{{- end }}
